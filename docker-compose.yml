services:
  mplink_postgres:
    image: postgis/postgis:16-3.5
    container_name: mplink_marketplace_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5436}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-marketplace_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    volumes:
      - mplink_pgdata:/var/lib/postgresql/data
      # ':z' relabela el archivo para SELinux (necesario en Fedora/RHEL).
      # En distros sin SELinux es inofensivo.
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-marketplace_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - back_mplink_net

  mplink_backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: mplink-backend:latest
    container_name: mplink_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: mplink_postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-marketplace_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      SERVER_PORT: ${SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5174,http://localhost}
      MODERATOR_DEFAULT_PASSWORD: ${MODERATOR_DEFAULT_PASSWORD:-SecretPasswordM123}
      SUSPENDED_TIME_DAYS: ${SUSPENDED_TIME_DAYS:-30}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - back_mplink_net
    depends_on:
      mplink_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mplink_pgdata:

networks:
  back_mplink_net:
    name: back_mplink_net
    driver: bridge
